[package]
name = "mutation-probe"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
description = "The skill's probe harness as a tested tool: applies exact-string mutants, proves the suite ran, and scores KILLED/SURVIVED/NO-RUN/HARNESS-ERROR."

[[bin]]
name = "mutation-probe"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
